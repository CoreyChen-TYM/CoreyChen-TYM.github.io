<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="1950" viewBox="0 0 1150 1950" role="img"><title>Head unit with a booster amplifier</title><rect width="100%" height="100%" fill="white"/><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto-start-reverse"><path d="M1 1L7 4.5L1 8" fill="none" stroke="#8c96a4" stroke-width="1.5"/></marker></defs><g font-family="Arial, sans-serif" fill="#1e2530"><rect x="25" y="150" width="1090" height="1140" rx="7" fill="white" stroke="#527bda" stroke-width="2"/><text x="42" y="180" font-size="24" font-weight="bold" text-anchor="start" fill="#1e2530"><tspan x="42" dy="0">Head unit</tspan></text><rect x="70" y="245" width="390" height="700" rx="7" fill="#e6edff" stroke="#527bda" stroke-width="2"/><text x="85" y="275" font-size="21" font-weight="bold" text-anchor="start" fill="#1e2530"><tspan x="85" dy="0">Main SoC: Qualcomm SA8295</tspan></text><rect x="85" y="300" width="360" height="335" rx="7" fill="#ffffce" stroke="#d4c947" stroke-width="2"/><text x="100" y="330" font-size="20" font-weight="bold" text-anchor="start" fill="#1e2530"><tspan x="100" dy="0">Multiple CPU cores</tspan></text><text x="110" y="370" font-size="21" font-weight="bold" text-anchor="start" fill="#1e2530"><tspan x="110" dy="0">Android</tspan></text><text x="110" y="400" font-size="17" font-weight="normal" text-anchor="start" fill="#1e2530"><tspan x="110" dy="0">Graphical interfaces: navigation,</tspan><tspan x="110" dy="22.950000000000003">QQ Music, and so on—much like</tspan><tspan x="110" dy="22.950000000000003">a smartphone.</tspan></text><polyline points="90,475 440,475" fill="none" stroke="#80b651" stroke-width="2.2" stroke-dasharray="3 6"/><text x="110" y="505" font-size="21" font-weight="bold" text-anchor="start" fill="#1e2530"><tspan x="110" dy="0">QNX</tspan></text><text x="110" y="535" font-size="14" font-weight="normal" text-anchor="start" fill="#1e2530"><tspan x="110" dy="0">Android runs as a virtual machine</tspan><tspan x="110" dy="18.900000000000002">on QNX. QNX handles tasks that</tspan><tspan x="110" dy="18.900000000000002">must not crash: vehicle communication,</tspan><tspan x="110" dy="18.900000000000002">reversing camera, warning sounds, etc.</tspan><tspan x="110" dy="18.900000000000002">Basic vehicle functions remain available</tspan><tspan x="110" dy="18.900000000000002">even if Android crashes.</tspan></text><rect x="85" y="645" width="120" height="280" rx="7" fill="#e0f4df" stroke="#7eb76b" stroke-width="2"/><text x="145.0" y="791.0" font-size="21" font-weight="normal" text-anchor="middle" fill="#1e2530"><tspan x="145.0" dy="0">gDSP</tspan></text><rect x="205" y="645" width="120" height="280" rx="7" fill="#fae6e5" stroke="#dc8c85" stroke-width="2"/><text x="265.0" y="791.0" font-size="21" font-weight="normal" text-anchor="middle" fill="#1e2530"><tspan x="265.0" dy="0">cDSP</tspan></text><rect x="325" y="645" width="120" height="280" rx="7" fill="#fff0da" stroke="#dda658" stroke-width="2"/><text x="385.0" y="791.0" font-size="21" font-weight="normal" text-anchor="middle" fill="#1e2530"><tspan x="385.0" dy="0">aDSP</tspan></text><rect x="70" y="1090" width="170" height="80" rx="7" fill="#e6edff" stroke="#527bda" stroke-width="2"/><text x="155.0" y="1136.0" font-size="19" font-weight="normal" text-anchor="middle" fill="#1e2530"><tspan x="155.0" dy="0">MCU</tspan></text><polyline points="145,945 145,1085" fill="none" stroke="#8c96a4" stroke-width="2.2" marker-end="url(#arrow)" marker-start="url(#arrow)"/><text x="165" y="1025" font-size="16" font-weight="normal" text-anchor="start" fill="#1e2530"><tspan x="165" dy="0">SPI: internal communication</tspan></text><rect x="720" y="175" width="170" height="80" rx="7" fill="#e6edff" stroke="#527bda" stroke-width="2"/><text x="805.0" y="221.0" font-size="19" font-weight="normal" text-anchor="middle" fill="#1e2530"><tspan x="805.0" dy="0">BT / Wi-Fi</tspan></text><rect x="720" y="30" width="170" height="70" rx="7" fill="#e6edff" stroke="#527bda" stroke-width="2"/><text x="805.0" y="71.0" font-size="19" font-weight="normal" text-anchor="middle" fill="#1e2530"><tspan x="805.0" dy="0">Owner’s phone</tspan></text><polyline points="805,100 805,175" fill="none" stroke="#333" stroke-width="2.2" stroke-dasharray="3 6"/><text x="820" y="140" font-size="16" font-weight="normal" text-anchor="start" fill="#1e2530"><tspan x="820" dy="0">Antenna</tspan></text><polyline points="460,385 520,385 520,215 715,215" fill="none" stroke="#8c96a4" stroke-width="2.2" marker-end="url(#arrow)" marker-start="url(#arrow)"/><text x="495" y="167" font-size="16" font-weight="normal" text-anchor="start" fill="#1e2530"><tspan x="495" dy="0">UART: Bluetooth music</tspan><tspan x="495" dy="21.6">and information to the</tspan><tspan x="495" dy="21.6">Android Bluetooth stack</tspan></text><polyline points="460,700 545,700 545,275 750,275 750,260" fill="none" stroke="#8c96a4" stroke-width="2.2" marker-end="url(#arrow)" marker-start="url(#arrow)"/><text x="550" y="310" font-size="16" font-weight="normal" text-anchor="start" fill="#1e2530"><tspan x="550" dy="0">I2S: Bluetooth call uplink / downlink</tspan></text><rect x="720" y="370" width="170" height="90" rx="7" fill="#e6edff" stroke="#527bda" stroke-width="2"/><text x="805.0" y="421.0" font-size="19" font-weight="normal" text-anchor="middle" fill="#1e2530"><tspan x="805.0" dy="0">ADC</tspan></text><polyline points="715,415 590,415 590,735 465,735" fill="none" stroke="#8c96a4" stroke-width="2.2" marker-end="url(#arrow)"/><text x="620" y="495" font-size="16" font-weight="normal" text-anchor="start" fill="#1e2530"><tspan x="620" dy="0">TDM8</tspan><tspan x="620" dy="21.6">5-seat: first 4 slots active</tspan><tspan x="620" dy="21.6">7-seat: first 6 slots active</tspan></text><polyline points="890,383 940,383" fill="none" stroke="#242424" stroke-width="2.2"/><text x="950" y="388" font-size="14" font-weight="normal" text-anchor="start" fill="#1e2530"><tspan x="950" dy="0">Driver analog mic</tspan></text><polyline points="890,403 940,403" fill="none" stroke="#242424" stroke-width="2.2"/><text x="950" y="408" font-size="14" font-weight="normal" text-anchor="start" fill="#1e2530"><tspan x="950" dy="0">Passenger analog mic</tspan></text><polyline points="890,423 940,423" fill="none" stroke="#242424" stroke-width="2.2"/><text x="950" y="428" font-size="14" font-weight="normal" text-anchor="start" fill="#1e2530"><tspan x="950" dy="0">Second-row left mic</tspan></text><polyline points="890,443 940,443" fill="none" stroke="#242424" stroke-width="2.2"/><text x="950" y="448" font-size="14" font-weight="normal" text-anchor="start" fill="#1e2530"><tspan x="950" dy="0">Second-row right mic</tspan></text><rect x="720" y="610" width="170" height="105" rx="7" fill="#e6edff" stroke="#527bda" stroke-width="2"/><text x="805.0" y="668.5" font-size="19" font-weight="normal" text-anchor="middle" fill="#1e2530"><tspan x="805.0" dy="0">A2B</tspan></text><rect x="725" y="650" width="40" height="30" rx="7" fill="#fff36b" stroke="#39404c" stroke-width="2"/><text x="745.0" y="671.0" font-size="14" font-weight="normal" text-anchor="middle" fill="#1e2530"><tspan x="745.0" dy="0">A</tspan></text><rect x="845" y="650" width="40" height="30" rx="7" fill="#fff36b" stroke="#39404c" stroke-width="2"/><text x="865.0" y="671.0" font-size="14" font-weight="normal" text-anchor="middle" fill="#1e2530"><tspan x="865.0" dy="0">B</tspan></text><polyline points="460,780 605,780 605,690 715,690" fill="none" stroke="#8c96a4" stroke-width="2.2" marker-end="url(#arrow)" marker-start="url(#arrow)"/><text x="480" y="755" font-size="16" font-weight="normal" text-anchor="start" fill="#1e2530"><tspan x="480" dy="0">6-wire TDM16: 32 channels down</tspan><tspan x="480" dy="21.6">and 32 channels up simultaneously</tspan></text><polyline points="460,455 660,455 660,595 805,595 805,605" fill="none" stroke="#8c96a4" stroke-width="2.2" marker-end="url(#arrow)"/><text x="670" y="565" font-size="16" font-weight="normal" text-anchor="start" fill="#1e2530"><tspan x="670" dy="0">I2C</tspan></text><rect x="720" y="955" width="170" height="65" rx="7" fill="#e6edff" stroke="#527bda" stroke-width="2"/><text x="805.0" y="993.5" font-size="17" font-weight="normal" text-anchor="middle" fill="#1e2530"><tspan x="805.0" dy="0">AM / FM tuner</tspan></text><polyline points="715,990 490.0,990 490.0,885.0 465,885.0" fill="none" stroke="#8c96a4" stroke-width="2.2" marker-end="url(#arrow)"/><text x="620" y="980" font-size="16" font-weight="normal" text-anchor="start" fill="#1e2530"><tspan x="620" dy="0">I2S</tspan></text><polyline points="890,990 965,990" fill="none" stroke="#242424" stroke-width="2.2"/><text x="975" y="995" font-size="15" font-weight="normal" text-anchor="start" fill="#1e2530"><tspan x="975" dy="0">Antenna</tspan></text><rect x="720" y="1050" width="170" height="65" rx="7" fill="#e6edff" stroke="#527bda" stroke-width="2"/><text x="805.0" y="1088.5" font-size="17" font-weight="normal" text-anchor="middle" fill="#1e2530"><tspan x="805.0" dy="0">DAB receiver</tspan></text><polyline points="715,1085 507.1,1085 507.1,896.4 465,896.4" fill="none" stroke="#8c96a4" stroke-width="2.2" marker-end="url(#arrow)"/><text x="620" y="1075" font-size="16" font-weight="normal" text-anchor="start" fill="#1e2530"><tspan x="620" dy="0">I2S</tspan></text><polyline points="890,1085 965,1085" fill="none" stroke="#242424" stroke-width="2.2" stroke-dasharray="3 6"/><text x="975" y="1090" font-size="15" font-weight="normal" text-anchor="start" fill="#1e2530"><tspan x="975" dy="0">Antenna</tspan></text><rect x="720" y="1145" width="170" height="65" rx="7" fill="#e6edff" stroke="#527bda" stroke-width="2"/><text x="805.0" y="1183.5" font-size="17" font-weight="normal" text-anchor="middle" fill="#1e2530"><tspan x="805.0" dy="0">Deserializer</tspan></text><polyline points="715,1180 524.2,1180 524.2,907.8 465,907.8" fill="none" stroke="#8c96a4" stroke-width="2.2" marker-end="url(#arrow)"/><text x="620" y="1170" font-size="16" font-weight="normal" text-anchor="start" fill="#1e2530"><tspan x="620" dy="0">I2S</tspan></text><polyline points="890,1180 965,1180" fill="none" stroke="#242424" stroke-width="2.2" stroke-dasharray="3 6"/><text x="975" y="1185" font-size="15" font-weight="normal" text-anchor="start" fill="#1e2530"><tspan x="975" dy="0">Nintendo console</tspan></text><rect x="720" y="1225" width="170" height="65" rx="7" fill="#e6edff" stroke="#527bda" stroke-width="2"/><text x="805.0" y="1263.5" font-size="17" font-weight="normal" text-anchor="middle" fill="#1e2530"><tspan x="805.0" dy="0">ADC</tspan></text><polyline points="715,1260 538.6,1260 538.6,917.4 465,917.4" fill="none" stroke="#8c96a4" stroke-width="2.2" marker-end="url(#arrow)"/><text x="620" y="1250" font-size="16" font-weight="normal" text-anchor="start" fill="#1e2530"><tspan x="620" dy="0">I2S</tspan></text><polyline points="890,1260 965,1260" fill="none" stroke="#242424" stroke-width="2.2"/><text x="975" y="1265" font-size="15" font-weight="normal" text-anchor="start" fill="#1e2530"><tspan x="975" dy="0">T-Box</tspan></text><text x="35" y="1335" font-size="17" font-weight="normal" text-anchor="start" fill="#1e2530"><tspan x="35" dy="0">External connections: solid = analog; dotted = digital. Internal buses are labeled.</tspan></text><rect x="250" y="1440" width="850" height="440" rx="7" fill="white" stroke="#527bda" stroke-width="2"/><text x="270" y="1475" font-size="24" font-weight="bold" text-anchor="start" fill="#1e2530"><tspan x="270" dy="0">Booster external amplifier</tspan></text><rect x="280" y="1530" width="150" height="95" rx="7" fill="#e6edff" stroke="#527bda" stroke-width="2"/><text x="355.0" y="1583.5" font-size="19" font-weight="normal" text-anchor="middle" fill="#1e2530"><tspan x="355.0" dy="0">A2B</tspan></text><rect x="285" y="1545" width="40" height="30" rx="7" fill="#fff36b" stroke="#39404c" stroke-width="2"/><text x="305.0" y="1566.0" font-size="14" font-weight="normal" text-anchor="middle" fill="#1e2530"><tspan x="305.0" dy="0">B</tspan></text><rect x="285" y="1590" width="40" height="30" rx="7" fill="#fff36b" stroke="#39404c" stroke-width="2"/><text x="305.0" y="1611.0" font-size="14" font-weight="normal" text-anchor="middle" fill="#1e2530"><tspan x="305.0" dy="0">A</tspan></text><polyline points="865,665 1125,665 1125,1400 260,1400 260,1558 280,1558" fill="none" stroke="#8c96a4" stroke-width="2.2" stroke-dasharray="3 6" marker-end="url(#arrow)" marker-start="url(#arrow)"/><text x="620" y="1390" font-size="16" font-weight="normal" text-anchor="start" fill="#1e2530"><tspan x="620" dy="0">A2B: multichannel PCM</tspan></text><rect x="780" y="1525" width="160" height="70" rx="7" fill="#e6edff" stroke="#527bda" stroke-width="2"/><text x="860.0" y="1566.0" font-size="17" font-weight="normal" text-anchor="middle" fill="#1e2530"><tspan x="860.0" dy="0">Amplifier_A</tspan></text><polyline points="435,1575 670,1575 670,1560 775,1560" fill="none" stroke="#8c96a4" stroke-width="2.2" marker-end="url(#arrow)"/><text x="678" y="1530" font-size="16" font-weight="normal" text-anchor="start" fill="#1e2530"><tspan x="678" dy="0">TDM</tspan></text><rect x="780" y="1780" width="160" height="70" rx="7" fill="#e6edff" stroke="#527bda" stroke-width="2"/><text x="860.0" y="1821.0" font-size="17" font-weight="normal" text-anchor="middle" fill="#1e2530"><tspan x="860.0" dy="0">Amplifier_N</tspan></text><polyline points="435,1575 670,1575 670,1815 775,1815" fill="none" stroke="#8c96a4" stroke-width="2.2" marker-end="url(#arrow)"/><text x="678" y="1785" font-size="16" font-weight="normal" text-anchor="start" fill="#1e2530"><tspan x="678" dy="0">TDM</tspan></text><polyline points="435,1600 580,1600 580,1495 860,1495 860,1520" fill="none" stroke="#8c96a4" stroke-width="2.2" marker-end="url(#arrow)"/><text x="500" y="1510" font-size="16" font-weight="normal" text-anchor="start" fill="#1e2530"><tspan x="500" dy="0">I2C: remote AMP register control</tspan></text><polyline points="580,1600 580,1860 860,1860 860,1855" fill="none" stroke="#8c96a4" stroke-width="2.2" marker-end="url(#arrow)"/><text x="860" y="1680" font-size="35" font-weight="normal" text-anchor="middle" fill="#1e2530"><tspan x="860" dy="0">⋮</tspan></text><polyline points="945,1560 980,1560" fill="none" stroke="#242424" stroke-width="2.2"/><text x="990" y="1565" font-size="13" font-weight="normal" text-anchor="start" fill="#1e2530"><tspan x="990" dy="0">Cabin speakers × N</tspan></text><polyline points="945,1670 980,1670" fill="none" stroke="#242424" stroke-width="2.2"/><text x="990" y="1675" font-size="13" font-weight="normal" text-anchor="start" fill="#1e2530"><tspan x="990" dy="0">Headrest speakers × N</tspan></text><polyline points="945,1815 980,1815" fill="none" stroke="#242424" stroke-width="2.2"/><text x="990" y="1820" font-size="13" font-weight="normal" text-anchor="start" fill="#1e2530"><tspan x="990" dy="0">Exterior speakers × N</tspan></text><text x="275" y="1925" font-size="15" font-weight="normal" text-anchor="start" fill="#1e2530"><tspan x="275" dy="0">No MCU or DSP: all routing and control are handled by the head unit.</tspan></text></g></svg>