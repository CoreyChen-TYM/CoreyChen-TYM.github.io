<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="1380" viewBox="0 0 1150 1380" role="img"><title>Head unit with built-in amplifiers</title><rect width="100%" height="100%" fill="white"/><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto-start-reverse"><path d="M1 1L7 4.5L1 8" fill="none" stroke="#8c96a4" stroke-width="1.5"/></marker></defs><g font-family="Arial, sans-serif" fill="#1e2530"><rect x="25" y="150" width="1090" height="1140" rx="7" fill="white" stroke="#527bda" stroke-width="2"/><text x="42" y="180" font-size="24" font-weight="bold" text-anchor="start" fill="#1e2530"><tspan x="42" dy="0">Head unit</tspan></text><rect x="70" y="245" width="390" height="700" rx="7" fill="#e6edff" stroke="#527bda" stroke-width="2"/><text x="85" y="275" font-size="21" font-weight="bold" text-anchor="start" fill="#1e2530"><tspan x="85" dy="0">Main SoC: Qualcomm SA8295</tspan></text><rect x="85" y="300" width="360" height="335" rx="7" fill="#ffffce" stroke="#d4c947" stroke-width="2"/><text x="100" y="330" font-size="20" font-weight="bold" text-anchor="start" fill="#1e2530"><tspan x="100" dy="0">Multiple CPU cores</tspan></text><text x="110" y="370" font-size="21" font-weight="bold" text-anchor="start" fill="#1e2530"><tspan x="110" dy="0">Android</tspan></text><text x="110" y="400" font-size="17" font-weight="normal" text-anchor="start" fill="#1e2530"><tspan x="110" dy="0">Graphical interfaces: navigation,</tspan><tspan x="110" dy="22.950000000000003">QQ Music, and so on—much like</tspan><tspan x="110" dy="22.950000000000003">a smartphone.</tspan></text><polyline points="90,475 440,475" fill="none" stroke="#80b651" stroke-width="2.2" stroke-dasharray="3 6"/><text x="110" y="505" font-size="21" font-weight="bold" text-anchor="start" fill="#1e2530"><tspan x="110" dy="0">QNX</tspan></text><text x="110" y="535" font-size="14" font-weight="normal" text-anchor="start" fill="#1e2530"><tspan x="110" dy="0">Android runs as a virtual machine</tspan><tspan x="110" dy="18.900000000000002">on QNX. QNX handles tasks that</tspan><tspan x="110" dy="18.900000000000002">must not crash: vehicle communication,</tspan><tspan x="110" dy="18.900000000000002">reversing camera, warning sounds, etc.</tspan><tspan x="110" dy="18.900000000000002">Basic vehicle functions remain available</tspan><tspan x="110" dy="18.900000000000002">even if Android crashes.</tspan></text><rect x="85" y="645" width="120" height="280" rx="7" fill="#e0f4df" stroke="#7eb76b" stroke-width="2"/><text x="145.0" y="791.0" font-size="21" font-weight="normal" text-anchor="middle" fill="#1e2530"><tspan x="145.0" dy="0">gDSP</tspan></text><rect x="205" y="645" width="120" height="280" rx="7" fill="#fae6e5" stroke="#dc8c85" stroke-width="2"/><text x="265.0" y="791.0" font-size="21" font-weight="normal" text-anchor="middle" fill="#1e2530"><tspan x="265.0" dy="0">cDSP</tspan></text><rect x="325" y="645" width="120" height="280" rx="7" fill="#fff0da" stroke="#dda658" stroke-width="2"/><text x="385.0" y="791.0" font-size="21" font-weight="normal" text-anchor="middle" fill="#1e2530"><tspan x="385.0" dy="0">aDSP</tspan></text><rect x="70" y="1090" width="170" height="80" rx="7" fill="#e6edff" stroke="#527bda" stroke-width="2"/><text x="155.0" y="1136.0" font-size="19" font-weight="normal" text-anchor="middle" fill="#1e2530"><tspan x="155.0" dy="0">MCU</tspan></text><polyline points="145,945 145,1085" fill="none" stroke="#8c96a4" stroke-width="2.2" marker-end="url(#arrow)" marker-start="url(#arrow)"/><text x="165" y="1025" font-size="16" font-weight="normal" text-anchor="start" fill="#1e2530"><tspan x="165" dy="0">SPI: internal communication</tspan></text><rect x="720" y="175" width="170" height="80" rx="7" fill="#e6edff" stroke="#527bda" stroke-width="2"/><text x="805.0" y="221.0" font-size="19" font-weight="normal" text-anchor="middle" fill="#1e2530"><tspan x="805.0" dy="0">BT / Wi-Fi</tspan></text><rect x="720" y="30" width="170" height="70" rx="7" fill="#e6edff" stroke="#527bda" stroke-width="2"/><text x="805.0" y="71.0" font-size="19" font-weight="normal" text-anchor="middle" fill="#1e2530"><tspan x="805.0" dy="0">Owner’s phone</tspan></text><polyline points="805,100 805,175" fill="none" stroke="#333" stroke-width="2.2" stroke-dasharray="3 6"/><text x="820" y="140" font-size="16" font-weight="normal" text-anchor="start" fill="#1e2530"><tspan x="820" dy="0">Antenna</tspan></text><polyline points="460,385 520,385 520,215 715,215" fill="none" stroke="#8c96a4" stroke-width="2.2" marker-end="url(#arrow)" marker-start="url(#arrow)"/><text x="495" y="167" font-size="16" font-weight="normal" text-anchor="start" fill="#1e2530"><tspan x="495" dy="0">UART: Bluetooth music</tspan><tspan x="495" dy="21.6">and information to the</tspan><tspan x="495" dy="21.6">Android Bluetooth stack</tspan></text><polyline points="460,700 545,700 545,275 750,275 750,260" fill="none" stroke="#8c96a4" stroke-width="2.2" marker-end="url(#arrow)" marker-start="url(#arrow)"/><text x="550" y="310" font-size="16" font-weight="normal" text-anchor="start" fill="#1e2530"><tspan x="550" dy="0">I2S: Bluetooth call uplink / downlink</tspan></text><rect x="720" y="370" width="170" height="90" rx="7" fill="#e6edff" stroke="#527bda" stroke-width="2"/><text x="805.0" y="421.0" font-size="19" font-weight="normal" text-anchor="middle" fill="#1e2530"><tspan x="805.0" dy="0">ADC</tspan></text><polyline points="715,415 590,415 590,735 465,735" fill="none" stroke="#8c96a4" stroke-width="2.2" marker-end="url(#arrow)"/><text x="620" y="495" font-size="16" font-weight="normal" text-anchor="start" fill="#1e2530"><tspan x="620" dy="0">TDM8</tspan><tspan x="620" dy="21.6">5-seat: first 4 slots active</tspan><tspan x="620" dy="21.6">7-seat: first 6 slots active</tspan></text><polyline points="890,383 940,383" fill="none" stroke="#242424" stroke-width="2.2"/><text x="950" y="388" font-size="14" font-weight="normal" text-anchor="start" fill="#1e2530"><tspan x="950" dy="0">Driver analog mic</tspan></text><polyline points="890,403 940,403" fill="none" stroke="#242424" stroke-width="2.2"/><text x="950" y="408" font-size="14" font-weight="normal" text-anchor="start" fill="#1e2530"><tspan x="950" dy="0">Passenger analog mic</tspan></text><polyline points="890,423 940,423" fill="none" stroke="#242424" stroke-width="2.2"/><text x="950" y="428" font-size="14" font-weight="normal" text-anchor="start" fill="#1e2530"><tspan x="950" dy="0">Second-row left mic</tspan></text><polyline points="890,443 940,443" fill="none" stroke="#242424" stroke-width="2.2"/><text x="950" y="448" font-size="14" font-weight="normal" text-anchor="start" fill="#1e2530"><tspan x="950" dy="0">Second-row right mic</tspan></text><rect x="720" y="605" width="170" height="85" rx="7" fill="#e6edff" stroke="#527bda" stroke-width="2"/><text x="805.0" y="653.5" font-size="19" font-weight="normal" text-anchor="middle" fill="#1e2530"><tspan x="805.0" dy="0">Amplifier_A</tspan></text><rect x="720" y="780" width="170" height="85" rx="7" fill="#e6edff" stroke="#527bda" stroke-width="2"/><text x="805.0" y="828.5" font-size="19" font-weight="normal" text-anchor="middle" fill="#1e2530"><tspan x="805.0" dy="0">Amplifier_B</tspan></text><polyline points="460,780 630,780 630,645 715,645" fill="none" stroke="#8c96a4" stroke-width="2.2" marker-end="url(#arrow)"/><text x="550" y="755" font-size="16" font-weight="normal" text-anchor="start" fill="#1e2530"><tspan x="550" dy="0">TDM8</tspan></text><polyline points="630,780 630,820 715,820" fill="none" stroke="#8c96a4" stroke-width="2.2" marker-end="url(#arrow)"/><text x="705" y="575" font-size="16" font-weight="normal" text-anchor="start" fill="#1e2530"><tspan x="705" dy="0">AMP_A: first 4 slots</tspan></text><text x="705" y="750" font-size="16" font-weight="normal" text-anchor="start" fill="#1e2530"><tspan x="705" dy="0">AMP_B: last 4 slots</tspan></text><polyline points="890,620 935,620" fill="none" stroke="#242424" stroke-width="2.2"/><text x="945" y="625" font-size="13" font-weight="normal" text-anchor="start" fill="#1e2530"><tspan x="945" dy="0">Front-left tweeter</tspan></text><polyline points="890,638 935,638" fill="none" stroke="#242424" stroke-width="2.2"/><text x="945" y="643" font-size="13" font-weight="normal" text-anchor="start" fill="#1e2530"><tspan x="945" dy="0">Front-left mid / woofer</tspan></text><polyline points="890,656 935,656" fill="none" stroke="#242424" stroke-width="2.2"/><text x="945" y="661" font-size="13" font-weight="normal" text-anchor="start" fill="#1e2530"><tspan x="945" dy="0">Front-right tweeter</tspan></text><polyline points="890,674 935,674" fill="none" stroke="#242424" stroke-width="2.2"/><text x="945" y="679" font-size="13" font-weight="normal" text-anchor="start" fill="#1e2530"><tspan x="945" dy="0">Front-right mid / woofer</tspan></text><polyline points="890,795 935,795" fill="none" stroke="#242424" stroke-width="2.2"/><text x="945" y="800" font-size="13" font-weight="normal" text-anchor="start" fill="#1e2530"><tspan x="945" dy="0">Front center speaker</tspan></text><polyline points="890,813 935,813" fill="none" stroke="#242424" stroke-width="2.2"/><text x="945" y="818" font-size="13" font-weight="normal" text-anchor="start" fill="#1e2530"><tspan x="945" dy="0">Rear-left speaker</tspan></text><polyline points="890,831 935,831" fill="none" stroke="#242424" stroke-width="2.2"/><text x="945" y="836" font-size="13" font-weight="normal" text-anchor="start" fill="#1e2530"><tspan x="945" dy="0">Rear-right speaker</tspan></text><polyline points="890,849 935,849" fill="none" stroke="#242424" stroke-width="2.2"/><text x="945" y="854" font-size="13" font-weight="normal" text-anchor="start" fill="#1e2530"><tspan x="945" dy="0">Exterior pedestrian warning</tspan></text><text x="730" y="900" font-size="17" font-weight="normal" text-anchor="start" fill="#1e2530"><tspan x="730" dy="0">Typical 5.0 audio system</tspan></text><rect x="720" y="955" width="170" height="65" rx="7" fill="#e6edff" stroke="#527bda" stroke-width="2"/><text x="805.0" y="993.5" font-size="17" font-weight="normal" text-anchor="middle" fill="#1e2530"><tspan x="805.0" dy="0">AM / FM tuner</tspan></text><polyline points="715,990 490.0,990 490.0,885.0 465,885.0" fill="none" stroke="#8c96a4" stroke-width="2.2" marker-end="url(#arrow)"/><text x="620" y="980" font-size="16" font-weight="normal" text-anchor="start" fill="#1e2530"><tspan x="620" dy="0">I2S</tspan></text><polyline points="890,990 965,990" fill="none" stroke="#242424" stroke-width="2.2"/><text x="975" y="995" font-size="15" font-weight="normal" text-anchor="start" fill="#1e2530"><tspan x="975" dy="0">Antenna</tspan></text><rect x="720" y="1050" width="170" height="65" rx="7" fill="#e6edff" stroke="#527bda" stroke-width="2"/><text x="805.0" y="1088.5" font-size="17" font-weight="normal" text-anchor="middle" fill="#1e2530"><tspan x="805.0" dy="0">DAB receiver</tspan></text><polyline points="715,1085 507.1,1085 507.1,896.4 465,896.4" fill="none" stroke="#8c96a4" stroke-width="2.2" marker-end="url(#arrow)"/><text x="620" y="1075" font-size="16" font-weight="normal" text-anchor="start" fill="#1e2530"><tspan x="620" dy="0">I2S</tspan></text><polyline points="890,1085 965,1085" fill="none" stroke="#242424" stroke-width="2.2" stroke-dasharray="3 6"/><text x="975" y="1090" font-size="15" font-weight="normal" text-anchor="start" fill="#1e2530"><tspan x="975" dy="0">Antenna</tspan></text><rect x="720" y="1145" width="170" height="65" rx="7" fill="#e6edff" stroke="#527bda" stroke-width="2"/><text x="805.0" y="1183.5" font-size="17" font-weight="normal" text-anchor="middle" fill="#1e2530"><tspan x="805.0" dy="0">Deserializer</tspan></text><polyline points="715,1180 524.2,1180 524.2,907.8 465,907.8" fill="none" stroke="#8c96a4" stroke-width="2.2" marker-end="url(#arrow)"/><text x="620" y="1170" font-size="16" font-weight="normal" text-anchor="start" fill="#1e2530"><tspan x="620" dy="0">I2S</tspan></text><polyline points="890,1180 965,1180" fill="none" stroke="#242424" stroke-width="2.2" stroke-dasharray="3 6"/><text x="975" y="1185" font-size="15" font-weight="normal" text-anchor="start" fill="#1e2530"><tspan x="975" dy="0">Nintendo console</tspan></text><rect x="720" y="1225" width="170" height="65" rx="7" fill="#e6edff" stroke="#527bda" stroke-width="2"/><text x="805.0" y="1263.5" font-size="17" font-weight="normal" text-anchor="middle" fill="#1e2530"><tspan x="805.0" dy="0">ADC</tspan></text><polyline points="715,1260 538.6,1260 538.6,917.4 465,917.4" fill="none" stroke="#8c96a4" stroke-width="2.2" marker-end="url(#arrow)"/><text x="620" y="1250" font-size="16" font-weight="normal" text-anchor="start" fill="#1e2530"><tspan x="620" dy="0">I2S</tspan></text><polyline points="890,1260 965,1260" fill="none" stroke="#242424" stroke-width="2.2"/><text x="975" y="1265" font-size="15" font-weight="normal" text-anchor="start" fill="#1e2530"><tspan x="975" dy="0">T-Box</tspan></text><text x="35" y="1335" font-size="17" font-weight="normal" text-anchor="start" fill="#1e2530"><tspan x="35" dy="0">External connections: solid = analog; dotted = digital. Internal buses are labeled.</tspan></text></g></svg>